[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dataify-sdk"
version = "1.0.0"
description = "Python SDK that calls the Dataify upstream REST API directly (no MCP layer) — web scrapers and search engines."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Dataify", email = "support@dataify.com"}]
keywords = ["dataify", "serp", "scraper", "google-search", "web-scraper", "amazon", "tiktok"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.urls]
Homepage = "https://dashboard.dataify.com"
Repository = "https://github.com/dataify/dataify-sdk"

[tool.hatch.build.targets.wheel]
packages = ["src/dataify_sdk"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
