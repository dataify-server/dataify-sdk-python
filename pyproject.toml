[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dataify-mcp"
version = "0.1.0"
description = "Python SDK for the Dataify MCP API — access web unlocker, search engines, and platform scrapers."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Dataify", email = "support@dataify.com"}]
keywords = ["mcp", "dataify", "serp", "scraper", "google-search", "web-unlocker"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.0.0",
    "typing-extensions>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.30.0",
    "mypy>=1.0.0",
    "ruff>=0.6.0",
    "jinja2>=3.0.0",
]

[project.urls]
Homepage = "https://dashboard.dataify.com"
Repository = "https://github.com/dataify/dataify-mcp-sdk"

[tool.hatch.build.targets.wheel]
packages = ["src/dataify_mcp"]
exclude = ["src/dataify_mcp/_codegen"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
strict = true
python_version = "3.10"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore:Field name.*shadows an attribute in parent.*BaseModel:UserWarning",
]
